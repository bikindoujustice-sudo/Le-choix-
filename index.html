o<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le choix - Boutique en Ligne</title>
    <!-- Styles CSS pour rendre la boutique jolie -->
    <style>
          :root {
    --primary-color: #1a1a1a;    /* Noir profond */
    --accent-color: #d4af37;     /* Or/Doré premium */
    --bg-color: #fcfcfc;         /* Fond de page clair */
    --card-bg: #ffffff;          /* Fond des produits blanc */
    --text-muted: #666666;       /* Gris pour les descriptions */
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
    background-color: var(--bg-color);
    color: #222;
  }

  <header>
  <h1>Le choix</h1>
  <p>Faites le meilleur choix parmi nos articles exclusifs</p>
  <!-- Bouton pour voir le panier -->
  <button class="snipcart-checkout">🛒 VOIR MON PANIER (0)</button>
</header>

<div class="container">
  <!-- CATEGORIE 1 : PARFUM -->
  <div class="product-card">
    <img src="https://unsplash.com" alt="Parfum de Luxe">
    <h3>Parfum Signature</h3>
    <p>Une fragrance envoûtante et longue durée aux notes subtiles et raffinées pour toutes les occasions.</p>
    <div class="product-price">45.00 €</div>
    <button class="buy-btn snipcart-add-item"
            data-item-id="parfum-signature"
            data-item-price="45.00"
            data-item-description="Parfum Signature Haute Qualité"
            data-item-image="https://unsplash.com"
            data-item-name="Parfum Signature">
      Ajouter au panier
    </button>
  </div>

  <!-- CATEGORIE 2 : PRODUIT DE MÉNAGE -->
  <div class="product-card">
    <img src="https://unsplash.com" alt="Produit de Ménage">
    <h3>Nettoyant Multi-Surfaces</h3>
    <p>Formule ultra-efficace qui dégraisse et fait briller votre maison tout en laissant une fraîcheur durable.</p>
    <div class="product-price">12.50 €</div>
    <button class="buy-btn snipcart-add-item"
            data-item-id="produit-menage-multi"
            data-item-price="12.50"
            data-item-description="Nettoyant ménager multi-surfaces efficace"
            data-item-image="https://unsplash.com"
            data-item-name="Nettoyant Multi-Surfaces">
      Ajouter au panier
    </button>
  </div>

  <!-- CATEGORIE 3 : PRODUIT DE CHEVEUX -->
  <div class="product-card">
    <img src="https://unsplash.com" alt="Produit Capillaire">
    <h3>Sérum Capillaire Nutritif</h3>
    <p>Soin intense enrichi en huiles naturelles pour hydrater, fortifier et redonner un éclat éclatant à vos cheveux.</p>
    <div class="product-price">24.99 €</div>
    <button class="buy-btn snipcart-add-item"
            data-item-id="serum-cheveux-nutritif"
            data-item-price="24.99"
            data-item-description="Sérum capillaire pour la brillance et la force"
            data-item-image="https://unsplash.com"
            data-item-name="Sérum Capillaire Nutritif">
      Ajouter au panier
    </button>
  </div>
</div>

</body>
</html>
